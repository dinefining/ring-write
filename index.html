<body>
  <main id="stage">
    <canvas id="canvas" role="img" aria-label="Grid canvas. Drag to paint cells; text fills the painted shape in rings."></canvas>

    <div id="ui">
      <div id="bar" class="row"></div>
      <section id="p-text" class="panel" aria-label="Text" hidden></section>
      <section id="p-ctrl" class="panel" aria-label="Controls" hidden></section>
    </div>

    <section id="info" class="panel" hidden aria-label="About ring_write">
      <div class="tile about">
        <p>Paint a shape on the grid, and your words trace the walls, ring inside ring, like a tree keeping time.</p>
        <p>A <a href="https://maybemachines.com" target="_blank" rel="noopener">Maybe Machine</a> by <a href="https://ravipopat.info" target="_blank" rel="noopener">Ravi Popat</a>.</p>
      </div>
    </section>
    <button id="info-btn" class="tile" type="button" aria-controls="info" aria-expanded="false">Info</button>

    <div id="hint" aria-hidden="true"></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
